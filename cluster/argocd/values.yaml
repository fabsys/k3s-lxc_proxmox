argo-cd:
  crds:
    install: true # -- Install and upgrade CRDs
    keep: false # -- Keep CRDs on chart uninstall
  server:
    extraArgs:
      - --insecure
    ingress:
      enabled: true
      ingressClassName: nginx-private
      annotations:
        nginx.ingress.kubernetes.io/ssl-redirect: "true"
        cert-manager.io/cluster-issuer: letsencrypt-prod-dns
        external-dns.alpha.kubernetes.io/hostname: "argocd.int.fabsys.ovh"
        external-dns.alpha.kubernetes.io/target: "192.168.1.251"
      hostname: "argocd.int.fabsys.ovh"
      tls: true

  configs:
    cm:
      # EndpointSlice est gere par Argo CD pour les services externes declares
      # dans Git. Les Endpoints historiques restent exclus.
      resource.exclusions: |
        - apiGroups:
            - ''
          kinds:
            - Endpoints
        - apiGroups:
            - coordination.k8s.io
          kinds:
            - Lease
        - apiGroups:
            - authentication.k8s.io
            - authorization.k8s.io
          kinds:
            - SelfSubjectReview
            - TokenReview
            - LocalSubjectAccessReview
            - SelfSubjectAccessReview
            - SelfSubjectRulesReview
            - SubjectAccessReview
        - apiGroups:
            - certificates.k8s.io
          kinds:
            - CertificateSigningRequest
        - apiGroups:
            - cert-manager.io
          kinds:
            - CertificateRequest
        - apiGroups:
            - cilium.io
          kinds:
            - CiliumIdentity
            - CiliumEndpoint
            - CiliumEndpointSlice
        - apiGroups:
            - kyverno.io
            - reports.kyverno.io
            - wgpolicyk8s.io
          kinds:
            - PolicyReport
            - ClusterPolicyReport
            - EphemeralReport
            - ClusterEphemeralReport
            - AdmissionReport
            - ClusterAdmissionReport
            - BackgroundScanReport
            - UpdateRequest
    secret:
      argocdServerAdminPassword: $2a$12$bIjjBTOvM53e4x1dqFN5UuNkAIAMjWDGYPJvAIftp3zpFPqCSwCOq # "admin" bcrypt hashed
