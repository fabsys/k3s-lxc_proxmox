---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant-relay
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: home-assistant-relay
  template:
    metadata:
      labels:
        app: home-assistant-relay
    spec:
      # Le pool Calico 192.168.0.0/16 chevauche le LAN. Le reseau du noeud
      # permet au relais d'atteindre Home Assistant sur 192.168.1.201.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: nginx
          image: nginx:1.29.1-alpine
          args:
            - nginx
            - -g
            - daemon off;
            - -c
            - /etc/nginx-custom/nginx.conf
          ports:
            - name: http
              containerPort: 18123
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 101
            runAsNonRoot: true
            runAsUser: 101
          volumeMounts:
            - name: config
              mountPath: /etc/nginx-custom/nginx.conf
              subPath: nginx.conf
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: home-assistant-relay
