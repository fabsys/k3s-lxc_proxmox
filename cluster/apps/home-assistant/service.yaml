---
apiVersion: v1
kind: Service
metadata:
  name: home-assistant
spec:
  # Home Assistant est heberge hors du cluster : pas de selector Kubernetes.
  ports:
    - name: http
      protocol: TCP
      port: 8123
      targetPort: 8123
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: home-assistant
  labels:
    kubernetes.io/service-name: home-assistant
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 8123
endpoints:
  - addresses:
      - 192.168.1.201
    conditions:
      ready: true
