---
apiVersion: v1
kind: Service
metadata:
  name: home-assistant
spec:
  # Home Assistant est heberge hors du cluster : pas de selector Kubernetes.
  ports:
    - name: http
      protocol: TCP
      port: 8123
      targetPort: 8123
---
apiVersion: v1
kind: Endpoints
metadata:
  name: home-assistant
subsets:
  - addresses:
      - ip: 192.168.1.201
    ports:
      - name: http
        protocol: TCP
        port: 8123
